<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Page</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 40px;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #4caf50;
      margin-bottom: 20px;
    }

    input, button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #4caf50;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #388e3c;
    }

    .back-btn {
      margin-top: 20px;
      background-color: #607d8b;
    }

    .back-btn:hover {
      background-color: #455a64;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Customer Page</h1>

    <button onclick="connectWallet()">Connect Wallet</button>
    <p id="walletAddress">Wallet not connected</p>

    <h3>Scan Product QR Code</h3>
    <video id="video" width="100%" height="auto"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <button onclick="startScanning()">Start Scanning</button>

    <p id="productInfo"></p>

    <button class="back-btn" onclick="window.location.href='index.html'">🔙 Back to Home</button>
  </div>

  <script>
    let contract;
    const contractAddress = "0xd9145CCE52D386f254917e481eB44e9943F39138"; // Replace with your contract address
    const abi = [
      {
        "inputs": [
          {
            "internalType": "string",
            "name": "_productID",
            "type": "string"
          }
        ],
        "name": "verifyProduct",
        "outputs": [
          {
            "internalType": "bool",
            "name": "",
            "type": "bool"
          }
        ],
        "stateMutability": "view",
        "type": "function"
      }
    ];

    // Connect wallet function
    async function connectWallet() {
      if (window.ethereum) {
        try {
          const accounts = await ethereum.request({ method: "eth_requestAccounts" });
          document.getElementById("walletAddress").innerText = "Connected: " + accounts[0];
        } catch (err) {
          alert("Failed to connect wallet.");
        }
      } else {
        alert("MetaMask not found. Please install MetaMask.");
      }
    }

    // Load the smart contract
    async function loadContract() {
      const provider = new ethers.providers.Web3Provider(window.ethereum);
      const signer = provider.getSigner();
      contract = new ethers.Contract(contractAddress, abi, signer);
    }

    // Start scanning the QR code
    function startScanning() {
      const videoElement = document.getElementById("video");
      const canvasElement = document.getElementById("canvas");
      const canvasContext = canvasElement.getContext("2d");

      // Access camera
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then((stream) => {
          videoElement.srcObject = stream;
          videoElement.play();

          requestAnimationFrame(scanQRCode);

          function scanQRCode() {
            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
              canvasElement.height = videoElement.videoHeight;
              canvasElement.width = videoElement.videoWidth;
              canvasContext.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

              const imageData = canvasContext.getImageData(0, 0, canvasElement.width, canvasElement.height);
              const code = jsQR(imageData.data, canvasElement.width, canvasElement.height);

              if (code) {
                const productID = code.data;
                displayProductInfo(productID);
              } else {
                requestAnimationFrame(scanQRCode);
              }
            } else {
              requestAnimationFrame(scanQRCode);
            }
          }
        })
        .catch((err) => {
          console.error("Error accessing camera: ", err);
        });
    }

    // Display product information and verify
    async function displayProductInfo(productID) {
      document.getElementById("productInfo").innerText = `Product ID: ${productID}`;

      // Verify product authenticity using smart contract
      try {
        await loadContract();
        const result = await contract.verifyProduct(productID);
        if (result) {
          alert("Product is authentic.");
        } else {
          alert("Product is not authentic.");
        }
      } catch (err) {
        console.error("Error verifying product:", err);
        alert("Error verifying product.");
      }
    }
  </script>

</body>
</html>
